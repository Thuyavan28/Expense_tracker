name: pinkledger
description: "PINKLEDGER - Every Rupee, Under Control. Advanced personal finance & expense tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.2.0

  # Local storage (offline-first, no cloud DB)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3

  # Biometric authentication
  local_auth: ^2.3.0

  # Charts
  fl_chart: ^0.69.0

  # Camera & images
  image_picker: ^1.1.2

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.2

  # PDF & CSV exports
  pdf: ^3.11.1
  printing: ^5.13.0
  csv: ^6.0.0
  path: ^1.9.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  connectivity_plus: ^6.0.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#041A10"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#041A10"
    theme_color: "#10B981"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
